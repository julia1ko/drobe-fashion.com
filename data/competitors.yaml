# Note: yes/no must stay quoted — unquoted they parse as YAML booleans
# and break the string comparisons in layouts/compare/list.html.
legend:
  "yes": "Available"
  partial: "Partial"
  "no": "Not available"

competitors:
  - name: Aesty
  - name: Alta Daily
  - name: Whering
  - name: Depop / Vinted
  - name: DROBE
    highlight: true

features:
  - label: 4D avatar from your own body
    values: [partial, partial, "no", "no", "yes"]
  - label: Your real closet digitised
    values: ["yes", "yes", "yes", "no", "yes"]
  - label: AI stylist
    values: ["yes", "yes", partial, "no", "yes"]
  - label: Event & calendar planning
    values: [partial, "yes", "no", "no", "yes"]
  - label: Try on shop items on your avatar
    values: ["no", "no", "no", "no", "yes"]
  - label: External retailer try-on
    values: ["no", "no", "no", "no", "yes"]
  - label: Peer-to-peer trade
    values: ["no", "no", "no", partial, "yes"]
  - label: Independent maker space
    values: ["no", "no", "no", partial, "yes"]
  - label: Sustainability tracker
    values: ["no", "no", partial, "no", "yes"]
